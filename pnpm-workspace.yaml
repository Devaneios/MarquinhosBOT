packages:
  - apps/*
  - packages/*

overrides:
  file-type: 21.3.4
  flatted: 3.4.2
  lodash: 4.18.1
  picomatch: 4.0.4
  tar: 7.5.13
  undici: 6.24.1

autoInstallPeers: false

allowBuilds:
  cpu-features: true
  esbuild: true
  ffmpeg-static: true
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  skia-canvas: true
  ssh2: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@nestjs/common@12.4.0'
  - '@nestjs/config@12.1.1'
  - '@nestjs/core@12.4.0'
  - '@nestjs/platform-express@12.4.0'
  - '@nestjs/schedule@12.0.3'
  - '@nestjs/testing@12.4.0'
  - '@scalar/astro@0.4.42'
  - '@scalar/client-side-rendering@0.4.24'
  - '@scalar/helpers@0.20.0'
  - '@scalar/schemas@0.20.1'
  - '@scalar/starlight@0.2.27'
  - '@scalar/types@0.32.1'
