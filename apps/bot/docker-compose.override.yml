services:
  marquinhosbot:
    command: bun run dev
    env_file: !reset []
    volumes:
      - ./.env:/app/apps/bot/.env:ro
      - ./src:/app/apps/bot/src:ro
      - ./tsconfig.json:/app/apps/bot/tsconfig.json:ro
    environment:
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
