name: Deploy

on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        default: all
        type: choice
        options: [all, api, bot, activity]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.component.outputs.component }}
      environment: ${{ steps.environment.outputs.environment }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: environment
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_REF" in
            refs/tags/v*)
              if ! git merge-base --is-ancestor "$EVENT_SHA" origin/main; then
                echo "::error::Tag ${EVENT_REF#refs/tags/} points to $EVENT_SHA, which is not on main"
                exit 1
              fi
              echo "environment=production" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/develop)
              echo "environment=development" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::$EVENT_REF does not deploy; use develop or a v* tag on main"
              exit 1
              ;;
          esac

      - id: component
        env:
          DISPATCH_COMPONENT: ${{ inputs.component }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "component=$DISPATCH_COMPONENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_REF" == refs/tags/* ]]; then
            if ! previous=$(git describe --tags --abbrev=0 --match 'v*' "$EVENT_SHA^" 2>/dev/null); then
              echo "component=all" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            files=$(git diff --name-only "$previous" "$EVENT_SHA")
          else
            files=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" 2>/dev/null || git show --format='' --name-only "$EVENT_SHA")
          fi
          api=false
          bot=false
          activity=false
          while IFS= read -r file; do
            case "$file" in
              apps/api/*) api=true ;;
              apps/bot/*) bot=true ;;
              apps/activity/*) activity=true ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|packages/*|deploy/*|.github/scripts/*|.github/workflows/*) api=true; bot=true; activity=true ;;
            esac
          done <<< "$files"
          count=0
          $api && ((count += 1))
          $bot && ((count += 1))
          $activity && ((count += 1))
          if ((count == 0)); then
            component=none
          elif ((count == 1)); then
            $api && component=api
            $bot && component=bot
            $activity && component=activity
          else
            component=all
          fi
          echo "component=$component" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.component != 'none'
    runs-on: ${{ needs.changes.outputs.environment == 'production' && 'hostinger-runner' || 'devaneios-runner' }}

    # Throwaway Postgres for the database tests. The host port is picked by
    # Docker so it never collides with anything already running on the runner.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g pnpm@11.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:deploy-env
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
        env:
          # The job context (mapped port) is only readable at step level.
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
      - run: pnpm run test:dev
      - run: pnpm run build

  deploy:
    needs: [changes, verify]
    if: needs.changes.outputs.component != 'none'
    runs-on: ${{ needs.changes.outputs.environment == 'production' && 'hostinger-runner' || 'devaneios-runner' }}
    environment: ${{ needs.changes.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.changes.outputs.environment }}
      cancel-in-progress: false
    env:
      AI_RESEARCH_DEADLINE_MS: ${{ vars.AI_RESEARCH_DEADLINE_MS }}
      AI_RESEARCH_MAX_FETCHES: ${{ vars.AI_RESEARCH_MAX_FETCHES }}
      AI_RESEARCH_MAX_ROUNDS: ${{ vars.AI_RESEARCH_MAX_ROUNDS }}
      AI_RESEARCH_RETENTION_DAYS: ${{ vars.AI_RESEARCH_RETENTION_DAYS }}
      AI_THREAD_RETENTION_DAYS: ${{ vars.AI_THREAD_RETENTION_DAYS }}
      AI_THREAD_TOKEN_BUDGET: ${{ vars.AI_THREAD_TOKEN_BUDGET }}
      AI_TRACE_ENABLED: ${{ vars.AI_TRACE_ENABLED }}
      AI_TRACE_RETENTION_DAYS: ${{ vars.AI_TRACE_RETENTION_DAYS }}
      BACKUP_DIR: ${{ vars.BACKUP_DIR }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      DEEZER_ARL_COOKIE: ${{ secrets.DEEZER_ARL_COOKIE }}
      DEPLOY_IMAGE_TAG: ${{ github.sha }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_REDIRECT_URI: ${{ vars.DISCORD_REDIRECT_URI }}
      GUILD_EXTERNAL_ROLE_ID: ${{ vars.GUILD_EXTERNAL_ROLE_ID }}
      GUILD_MAIN_CHANNEL_ID: ${{ vars.GUILD_MAIN_CHANNEL_ID }}
      GUILD_NEWCOMERS_CHANNEL_ID: ${{ vars.GUILD_NEWCOMERS_CHANNEL_ID }}
      KNOWLEDGE_BASE_API_KEY: ${{ secrets.KNOWLEDGE_BASE_API_KEY }}
      KNOWLEDGE_BASE_URL: ${{ vars.KNOWLEDGE_BASE_URL }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_REDIRECT_URI: ${{ vars.LASTFM_REDIRECT_URI }}
      LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      MARQUINHOS_API_KEY: ${{ secrets.MARQUINHOS_API_KEY }}
      MARQUINHOS_CRYPTO_SALT: ${{ secrets.MARQUINHOS_CRYPTO_SALT }}
      MARQUINHOS_DECRYPTION_KEY: ${{ secrets.MARQUINHOS_DECRYPTION_KEY }}
      MARQUINHOS_ERROR_DM_USER_ID: ${{ vars.MARQUINHOS_ERROR_DM_USER_ID }}
      MARQUINHOS_SECRET_KEY: ${{ secrets.MARQUINHOS_SECRET_KEY }}
      MARQUINHOS_SPREADSHEET_API_KEY: ${{ secrets.MARQUINHOS_SPREADSHEET_API_KEY }}
      MARQUINHOS_SPREADSHEET_ID: ${{ vars.MARQUINHOS_SPREADSHEET_ID }}
      MARQUINHOS_TOKEN: ${{ secrets.MARQUINHOS_TOKEN }}
      MARQUINHOS_WEB_URL: ${{ vars.MARQUINHOS_WEB_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SANDBOX_MIRROR_PATH: ${{ vars.SANDBOX_MIRROR_PATH }}
      SEARXNG_URL: ${{ vars.SEARXNG_URL }}
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
      VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
      WORDLE_TIMEZONE: ${{ vars.WORDLE_TIMEZONE }}

    steps:
      - uses: actions/checkout@v7

      - name: Write deployment environment
        run: bash .github/scripts/write-deploy-env.sh deploy/.env

      - name: Deploy
        env:
          COMPONENT: ${{ needs.changes.outputs.component }}
        run: bash deploy/deploy.sh "$COMPONENT"

      - name: Scan API image
        if: needs.changes.outputs.component == 'api' || needs.changes.outputs.component == 'all'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: marquinhos-api:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Scan bot image
        if: needs.changes.outputs.component == 'bot' || needs.changes.outputs.component == 'all'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: marquinhos-bot:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Scan Activity image
        if: needs.changes.outputs.component == 'activity' || needs.changes.outputs.component == 'all'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: marquinhos-activity:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Remove generated environment files
        if: always()
        run: rm -f -- deploy/.env deploy/api.env deploy/bot.env
