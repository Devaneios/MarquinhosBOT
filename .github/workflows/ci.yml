name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run test:deploy-env
      - run: bun run --filter marquinhos-web-api typecheck
      - run: bun run --filter marquinhos-web-api lint
      - run: bun run --filter marquinhos-web-api format:check
      - run: bun run --filter marquinhos-web-api test
      - run: bun run --filter marquinhos-web-api build
      - run: bun run --filter marquinhosbot typecheck
      - run: bun run --filter marquinhosbot lint:check
      - run: bun run --filter marquinhosbot format:check
      - run: bun run --filter marquinhosbot test
      - run: bun run --filter marquinhosbot build
      - run: bun run --filter marquinhos-activity-client typecheck
      - run: bun run --filter marquinhos-activity-client lint
      - run: bun run --filter marquinhos-activity-client format:check
      - run: bun run --filter marquinhos-activity-client test
      - run: bun run --filter marquinhos-activity-client build
